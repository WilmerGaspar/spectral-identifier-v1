<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="330" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">RRUFF data pipeline</text>

  <!-- box 1: server -->
  <rect x="30" y="80" width="260" height="140" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">RRUFF server</text>
  <text x="160" y="154" text-anchor="middle" font-size="14" fill="#1e40af">zipped data files</text>
  <text x="160" y="176" text-anchor="middle" font-size="14" fill="#1e40af">(.zip)</text>

  <!-- arrow 1 -->
  <line x1="298" y1="150" x2="462" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="380" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">download + unzip</text>
  <text x="380" y="178" text-anchor="middle" font-size="11" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#475569">extract_data_rruff.py</text>

  <!-- box 2: source -->
  <rect x="470" y="80" width="260" height="140" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="124" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f" font-family="DejaVu Sans Mono, Consolas, monospace">data/source/&lt;dataset&gt;/</text>
  <text x="600" y="154" text-anchor="middle" font-size="14" fill="#92400e">unzipped .txt files</text>
  <text x="600" y="176" text-anchor="middle" font-size="14" fill="#92400e">(originals)</text>

  <!-- arrow 2 -->
  <line x1="738" y1="150" x2="902" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">split</text>
  <text x="820" y="178" text-anchor="middle" font-size="11" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#475569">process_data.py</text>

  <!-- box 3: parsed -->
  <rect x="910" y="80" width="260" height="140" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1040" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d" font-family="DejaVu Sans Mono, Consolas, monospace">data/parsed/&lt;dataset&gt;/</text>
  <text x="1040" y="146" text-anchor="middle" font-size="14" fill="#166534">CSV + JSON files</text>
  <rect x="936" y="165" width="96" height="34" rx="17" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="984" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">raw</text>
  <rect x="1048" y="165" width="110" height="34" rx="17" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1103" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">processed</text>

  <!-- notes under the boxes -->
  <text x="160" y="254" text-anchor="middle" font-size="12.5" fill="#64748b">datasets: raman · powder · infrared</text>
  <text x="600" y="254" text-anchor="middle" font-size="12.5" fill="#64748b">deleted by --clean after a verified split</text>
  <text x="1040" y="254" text-anchor="middle" font-size="12.5" fill="#64748b">the data you keep</text>
</svg>
